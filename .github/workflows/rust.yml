name: Rust

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    paths:
      - .github/workflows/ha-exporter.yml
      - app/home-assistant-exporter/**
      - Cargo.lock
      - Cargo.toml

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Cache"
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: "Build"
        run: cargo build
