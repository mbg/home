name: CodeQL

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  analyse:
    name: "Analyse"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
          - language: rust

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Initialise analysis"
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: "Analyse"
        uses: github/codeql-action/analyze@v4
