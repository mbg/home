version: 2
updates:
  - package-ecosystem: github-actions
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    directories:
      - /
  - package-ecosystem: docker
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    directories:
      - app/home-assistant-exporter/
  - package-ecosystem: cargo
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    directories:
      - /
