- &common
  version: 0.1.0.0
  github: "mbg/home"
  license: "AGPL-3"
  author: "Michael B. Gale"
  maintainer: "github@michael-gale.co.uk"
  copyright: "2025 Michael B. Gale"

  description: Please see the README on GitHub at <https://github.com/githubuser/home#readme>

  ghc-options:
    - -Wall
    - -Wcompat
    - -Widentities
    - -Wincomplete-record-updates
    - -Wincomplete-uni-patterns
    - -Wmissing-export-lists
    - -Wmissing-home-modules
    - -Wpartial-fields
    - -Wredundant-constraints

  default-extensions:
    - DataKinds

  dependencies:
    - base >= 4.7 && < 5
