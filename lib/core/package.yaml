_common: !include "../../common/hpack/lib.yaml"

name: home-core
<<: *common

library:
  source-dirs: src

  dependencies:
    - aeson
    - deriving-aeson
    - directory
    - filepath
    - yaml

tests:
  home-core-tests:
    main: Spec.hs
    source-dirs: test
    build-tools:
      - tasty-discover:tasty-discover
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -Wno-missing-export-lists
    dependencies:
      - aeson
      - hedgehog
      - home-core
      - tasty
      - tasty-discover
      - tasty-hedgehog
      - yaml
