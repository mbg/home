_common: !include "../../common/hpack/lib.yaml"

name: home-api-server
<<: *common

executables:
  home-api-server:
    main: Main.hs
    source-dirs: src
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - home-core
      - home-db
      - home-api
      - home-api-handlers
